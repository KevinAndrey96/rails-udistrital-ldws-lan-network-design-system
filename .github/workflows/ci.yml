name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Domain services (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none
      - name: VLSM planner, cabling estimator and tier selector
        run: ruby -Itest -e 'Dir["test/services/**/*_test.rb"].sort.each { |file| require "./#{file}" }'

  rails:
    name: Rails suite and boot smoke test (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ldws-rails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rails test suite (renders every PDF report with wkhtmltopdf)
        run: >-
          docker run --rm -e RAILS_ENV=test --entrypoint sh ldws-rails:ci
          -c "bundle exec rake db:schema:load test"
      - name: Boot the production-like container and sign in page
        run: |
          docker run -d --name ldws -p 3000:3000 -e LDWS_ADMIN_PASSWORD=ci-smoke-password ldws-rails:ci
          for attempt in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/users/sign_in || true)
            if [ "$code" = "200" ]; then
              echo "sign in page answered 200 after $attempt attempts"
              exit 0
            fi
            sleep 3
          done
          docker logs ldws
          exit 1
