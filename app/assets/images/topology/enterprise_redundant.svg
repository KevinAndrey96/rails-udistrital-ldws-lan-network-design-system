<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="380" viewBox="0 0 640 380" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Topología Enterprise con redundancia</title>
