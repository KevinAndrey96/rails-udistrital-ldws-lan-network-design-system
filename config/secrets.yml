# Secrets are read from the environment; none are stored in the repository.
# Generate a value with `bundle exec rake secret` and export SECRET_KEY_BASE.
#
# Development and test fall back to an ephemeral random key, so sessions
# are simply invalidated on every boot. Production refuses to start without it
# (Rails raises "Missing secret_key_base"). The whole file is rendered for every
# environment, so production must not use ENV.fetch here.

development:
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE") { require "securerandom"; SecureRandom.hex(64) } %>

test:
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE") { require "securerandom"; SecureRandom.hex(64) } %>

production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
